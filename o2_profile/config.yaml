cluster:
  mkdir -p logs/mtbc-highquality/{rule} &&
  sbatch
    --partition={resources.partition}
    --cpus-per-task={threads}
    --mem={resources.mem_gb}G
    --time={resources.time}
    --job-name=smk-{rule}-{wildcards}
    --output=logs/mtbc-highquality/{rule}/{rule}-{wildcards}-%j.out
    --output=logs/mtbc-highquality/{rule}/{rule}-{wildcards}-%j.err
    --parsable
default-resources:
  - partition=short
  - mem_gb=1
  - time="0-10:00:00"
restart-times: 3
max-jobs-per-second: 50
max-status-checks-per-second: 1
local-cores: 1
latency-wait: 60
jobs: 500
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True
cores: 14

groups:
  - unitig_splits_presenceabsence=group_unitig_splits_presenceabsence
  - unitig_split_matrix=group_unitig_split_matrix
  - unitig_split_matrix=group_unitig_split_matrix
  - add_color_gfatag=group_color_gfatag
    
group-components:
  - group_unitig_splits_presenceabsence=100
  - group_unitig_split_matrix=100
  - group_color_gfatag=100
